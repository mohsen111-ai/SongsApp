<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SongsApp">
<title>SongsApp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wpbg" id="wpbg"></div>
<div id="app">
  <header class="top">
    <div class="brand"><img src="icons/mascot.svg" alt="" width="38" height="38"><h1>SongsApp</h1></div>
    <button id="addBtn" class="pill" type="button">＋ Add songs</button>
    <input id="file" type="file" accept="audio/*" multiple hidden>
  </header>

  <div class="search"><input id="q" type="search" placeholder="Search songs, artists, albums" autocomplete="off" enterkeyhint="search"></div>

  <main id="main" tabindex="-1"></main>

  <div id="mini" class="mini" hidden>
    <button class="mini-open" type="button" aria-label="Open player">
      <span id="miniCov" class="cov-wrap"></span>
      <span class="meta"><b id="miniTitle"></b><span id="miniArtist"></span></span>
    </button>
    <button id="miniPlay" class="ic big" type="button" aria-label="Play or pause"></button>
    <button id="miniNext" class="ic" type="button" aria-label="Next"></button>
    <div class="mini-prog"><i id="miniBar"></i></div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-view="library" class="on" type="button"><span></span>Library</button>
    <button data-view="favs" type="button"><span></span>Favourites</button>
    <button data-view="lists" type="button"><span></span>Playlists</button>
    <button data-view="recent" type="button"><span></span>Recent</button>
    <button data-view="looks" type="button"><span></span>Looks</button>
  </nav>
</div>

<section id="full" class="full" aria-hidden="true">
  <canvas id="viz" class="viz"></canvas>
  <div class="full-top">
    <button id="fullClose" class="ic" type="button" aria-label="Close"></button>
    <span>Now playing</span>
    <button id="fullMore" class="ic" type="button" aria-label="More"></button>
  </div>
  <div class="full-scroll">
    <div class="stage">
      <div id="fullCov" class="cover-big"></div>
      <img class="peek" src="icons/mascot.svg" alt="" width="84" height="84">
    </div>
    <div class="full-meta">
      <div><h2 id="fullTitle"></h2><p id="fullArtist"></p><button id="moodBtn" class="mood" type="button" aria-label="Change mood"></button></div>
      <button id="fullFav" class="ic heart" type="button" aria-label="Favourite"></button>
    </div>
    <div class="seek">
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="bShuffle" class="ic" type="button" aria-label="Shuffle"></button>
      <button id="bPrev" class="ic" type="button" aria-label="Previous"></button>
      <button id="bPlay" class="play" type="button" aria-label="Play or pause"></button>
      <button id="bNext" class="ic" type="button" aria-label="Next"></button>
      <button id="bRepeat" class="ic" type="button" aria-label="Repeat"></button>
    </div>
    <div class="up-next"><h3>Up next</h3><div id="upNext"></div></div>
  </div>
</section>

<dialog id="sheet"><div class="sheet-in"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="moods.js"></script>
<script src="app.js"></script>
</body>
</html>
