<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Live Prototype</title>
<style>
  :root { color-scheme: dark; --bg:#0d0b12; --fg:#ece6f2; --dim:#9a90a8; --accent:#ff8a3d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(12px + env(safe-area-inset-bottom));
         background:linear-gradient(transparent, rgba(13,11,18,.92) 40%); }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  .btn { flex:1; border:1px solid #3a3347; background:rgba(30,25,40,.8); color:var(--fg); padding:10px 8px; border-radius:12px; font-size:14px; }
  .btn[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .strip::-webkit-scrollbar { display:none; }
  .strip img { width:52px; height:52px; border-radius:12px; object-fit:cover; flex:none; border:2px solid transparent; opacity:.75; }
  .strip img.on { border-color:var(--accent); opacity:1; }
  .hint { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:16px; right:16px; font-size:12px; color:var(--dim); pointer-events:none; text-shadow:0 1px 4px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Drag your finger over her. She follows it, blinks, breathes and talks.</div>
<div class="bar">
  <div class="row">
    <button class="btn" id="auto" aria-pressed="false">Auto mood</button>
    <button class="btn" id="talk" aria-pressed="false">Talking</button>
    <button class="btn" id="say">Say hi</button>
    <button class="btn" id="blinkNow">Blink</button>
  </div>
  <div class="strip" id="strip"></div>
</div>
<script>
const POSES = /*POSES*/[];
const FEATS = /*FEATS*/[];
const EXTRAS = /*EXTRAS*/{};   // real edited eyes-closed / mouth-open pictures + masks, by pose index

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias:false, premultipliedAlpha:false, powerPreference:'high-performance' });

const VS = `attribute vec2 p; varying vec2 v; uniform vec2 uvS, uvO;
void main(){ vec2 q = p*0.5+0.5; v = vec2(q.x*uvS.x + uvO.x, (1.0-q.y)*uvS.y + uvO.y); gl_Position = vec4(p,0,1); }`;

const FS = `precision highp float;
varying vec2 v;
uniform sampler2D A, B, X, Y, Z;
uniform float hx;   // 1 when pose A has real eyes-closed (X), mouth-open (Y) pictures and masks (Z)
uniform float mixv, t, blink, tx, ty, talk, mouth;
uniform vec4 EA0, SA0, EA1, SA1, MA, NA;   // pose A: eye geometry+style (x2), mouth geometry+style
uniform vec4 EB0, SB0, EB1, SB1, MB, NB;   // pose B

vec3 hsv(vec3 c){
  vec4 K = vec4(0.,-1./3.,2./3.,-1.);
  vec4 p = mix(vec4(c.bg,K.wz), vec4(c.gb,K.xy), step(c.b,c.g));
  vec4 q = mix(vec4(p.xyw,c.r), vec4(c.r,p.yzx), step(p.x,c.r));
  float d = q.x - min(q.w,q.y);
  return vec3(abs(q.z + (q.w-q.y)/(6.*d+1e-10)), d/(q.x+1e-10), q.x);
}
vec3 eyeLid(vec3 col, vec2 p, vec4 e, vec4 s, float b){
  if (e.z <= 0. || b < .01) return col;
  vec2 d = p - e.xy; float ca = cos(s.x), sa = sin(s.x);
  float u = (d.x*ca + d.y*sa) / e.z, w = (-d.x*sa + d.y*ca) / e.w;
  float r = sqrt(u*u + w*w);
  float inside = 1. - smoothstep(.98, 1.18, r);
  float arch = .30*(1.-u*u)*b;
  float wt = mix(-1.25, .04, b) + arch;
  float wb = mix(1.25, .04, b) + arch;
  float cover = max(1. - smoothstep(wt-.06, wt+.06, w), smoothstep(wb-.06, wb+.06, w)) * inside;
  col = mix(col, s.yzw, cover);
  float th = .11*(.6 + .4*(1.-u*u));
  float line = exp(-pow((w - wt)/th, 2.)) * smoothstep(.08,.30,b) * inside * (1. - smoothstep(.9,1.12,abs(u)));
  return mix(col, vec3(.09,.05,.06), clamp(line*.9,0.,1.));
}
vec4 live(sampler2D T, vec2 p, vec4 e0, vec4 s0, vec4 e1, vec4 s1, vec4 mg, vec4 ms, float real){
  // breathing about the bottom centre
  float br = sin(t*1.5)*.5+.5;
  p = (p - vec2(.5,1.)) / (1. + .010*br) + vec2(.5,1.);
  // head turn / tilt: the top moves more than the bottom
  float up = 1. - p.y;
  p.x += tx * .035 * up*up;
  p.y += ty * .02 * up*up;
  // hair sway: soft mask, more movement toward the ends
  float m = texture2D(T,p).a;   // hair mask, computed once when the picture loads
  float w = m * (.25 + .75*smoothstep(.08,.85,p.y));
  vec2 d = vec2(sin(t*1.3 + p.y*7. + p.x*2.) + .5*sin(t*2.3 + p.y*13.),
                .45*sin(t*1.1 + p.x*6.)) * .0048 * w;
  d.x += tx * .010 * w;
  p += d;
  // mouth: the lower lip slides down and the gap shows the inside of her mouth
  float gapM = 0.; float opened = 0.; float uu = 0.; float ww = 0.;
  if (real < .5 && ms.y > .5 && mouth > .004) {
    vec2 d0 = p - mg.xy; float ca = cos(ms.x), sa = sin(ms.x);
    uu = (d0.x*ca + d0.y*sa) / mg.z; ww = (-d0.x*sa + d0.y*ca) / mg.w;
    float k = (1. - smoothstep(.7,1.5,abs(uu))) * (1. - smoothstep(1.4,3.6,ww)) * smoothstep(-3.,-1.4,ww);
    float shv = mouth*1.0*k, upv = mouth*.22*k;
    float ws = ww;
    if (ww > shv) ws = ww - shv; else if (ww < -upv) ws = ww + upv; else ws = 0.;
    if (shv + upv > .05 && ww <= shv && ww >= -upv) { gapM = 1. - smoothstep(.72,1.0,abs(uu)); opened = (ww+upv)/(shv+upv); }
    p = mg.xy + vec2(uu*mg.z*ca - ws*mg.w*sa, uu*mg.z*sa + ws*mg.w*ca);
  }
  vec4 col = texture2D(T,p);
  col.rgb = mix(col.rgb, mix(vec3(.08,.025,.04), vec3(.36,.10,.15), smoothstep(.35,1.,opened)*.7*mouth), gapM);
  if (real > .5) {
    vec2 mk = texture2D(Z,p).rg;
    if (mk.r * blink > .002) col.rgb = mix(col.rgb, texture2D(X,p).rgb, mk.r * blink);
    float mo = smoothstep(.08,.85,mouth);
    if (mk.g * mo > .002) col.rgb = mix(col.rgb, texture2D(Y,p).rgb, mk.g * mo);
  } else {
    col.rgb = eyeLid(col.rgb, p, e0, s0, blink);
    col.rgb = eyeLid(col.rgb, p, e1, s1, blink);
  }
  return col;
}
void main(){
  vec4 c;
  if (mixv < .002) c = live(A,v,EA0,SA0,EA1,SA1,MA,NA,hx);
  else if (mixv > .998) c = live(B,v,EB0,SB0,EB1,SB1,MB,NB,0.);
  else c = mix(live(A,v,EA0,SA0,EA1,SA1,MA,NA,hx), live(B,v,EB0,SB0,EB1,SB1,MB,NB,0.), mixv);
  float edge = smoothstep(1.0, 0.88, v.y) * smoothstep(0.0, 0.03, v.x) * smoothstep(1.0, 0.97, v.x);          // fade the bottom of the picture into the background
  gl_FragColor = vec4(mix(vec3(.051,.043,.071), c.rgb, edge), 1.);
}`;

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(prog, n);
const feat = {}; ['EA0','SA0','EA1','SA1','MA','NA','EB0','SB0','EB1','SB1','MB','NB'].forEach(n => feat[n] = U(n));
const u = { hx:U('hx'), X:U('X'), Y:U('Y'), Z:U('Z'), mouth:U('mouth'), uvS:U('uvS'), uvO:U('uvO'), A:U('A'), B:U('B'), mixv:U('mixv'), t:U('t'), blink:U('blink'), tx:U('tx'), ty:U('ty'), talk:U('talk') };

const tex = [];
function load(i){
  return new Promise(res => {
    if (tex[i]) return res(tex[i]);
    const im = new Image();
    im.onload = () => {
      const T = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, T);
      const W = im.naturalWidth, H = im.naturalHeight;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const cx = cv.getContext('2d', { willReadFrequently:true }); cx.drawImage(im,0,0);
      const px = cx.getImageData(0,0,W,H).data, m = new Float32Array(W*H), sm = (a,b,x) => { x = Math.min(1,Math.max(0,(x-a)/(b-a))); return x*x*(3-2*x); };
      for (let k = 0, j = 0; k < px.length; k += 4, j++) {
        const r = px[k]/255, g = px[k+1]/255, b = px[k+2]/255, sat = (r-b)/Math.max(r,.001), hue = (g-b)/Math.max(r-b,.001);
        m[j] = (hue >= .12 && hue <= .72 && g <= r) ? sm(.5,.62,sat)*sm(.4,.55,r) : 0;
      }
      const tmp = new Float32Array(W*H), R = 3, n = 2*R+1;      // soften the mask with a small box blur
      for (let y = 0; y < H; y++) { let acc = 0; const o = y*W; for (let x = -R; x <= R; x++) acc += m[o + Math.min(W-1, Math.max(0,x))];
        for (let x = 0; x < W; x++) { tmp[o+x] = acc/n; acc += m[o + Math.min(W-1,x+R+1)] - m[o + Math.max(0,x-R)]; } }
      for (let x = 0; x < W; x++) { let acc = 0; for (let y = -R; y <= R; y++) acc += tmp[Math.min(H-1, Math.max(0,y))*W + x];
        for (let y = 0; y < H; y++) { m[y*W+x] = acc/n; acc += tmp[Math.min(H-1,y+R+1)*W + x] - tmp[Math.max(0,y-R)*W + x]; } }
      for (let k = 0, j = 0; k < px.length; k += 4, j++) px[k+3] = Math.round(m[j]*255);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(px.buffer));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      tex[i] = T; res(T);
    };
    im.src = POSES[i];
  });
}

const extra = {};   // pose index -> [closed, open, mask] textures
function loadImg(src, filter){
  return new Promise(res => { const im = new Image(); im.onload = () => {
    const T = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, T);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    res(T); }; im.src = src; });
}
async function loadExtras(){
  for (const k of Object.keys(EXTRAS)) { const e = EXTRAS[k]; extra[k] = [await loadImg(e.x), await loadImg(e.y), await loadImg(e.z)]; }
}
let cur = 0, nxt = 0, mixv = 1, fading = false;
async function setPose(i){
  if (i === cur && !fading) return;
  await load(i);
  nxt = i; mixv = 0; fading = true;
  [...strip.children].forEach((c,k) => c.classList.toggle('on', k === i));
}

const strip = document.getElementById('strip');
POSES.forEach((src,i) => {
  const im = new Image(); im.src = src; im.onclick = () => { autoOn = false; autoBtn.setAttribute('aria-pressed','false'); setPose(i); };
  strip.appendChild(im);
});

// per-pose eye / mouth data -> shader uniforms
const PX = 896, rad = d => d*Math.PI/180;
function featUniforms(i, side){
  const f = FEATS[i] || {eyes:[], lips:null};
  [0,1].forEach(k => {
    const e = f.eyes[k];
    gl.uniform4f(feat['E'+side+k], e ? e.c[0]/PX : 0, e ? e.c[1]/PX : 0, e ? e.rx/PX : 0, e ? e.ry/PX : 0);
    gl.uniform4f(feat['S'+side+k], e ? rad(e.ang) : 0, e ? e.skin[0]/255 : 0, e ? e.skin[1]/255 : 0, e ? e.skin[2]/255 : 0);
  });
  const l = f.lips;
  gl.uniform4f(feat['M'+side], l ? l.c[0]/PX : 0, l ? l.c[1]/PX : 0, l ? l.rx/PX : 0, l ? l.ry/PX : 0);
  gl.uniform4f(feat['N'+side], l ? rad(l.ang) : 0, l ? 1 : 0, 0, 0);
}

// state
let tx = 0, ty = 0, gx = 0, gy = 0, blinkT = -1, nextBlink = 2, talk = 0, talkOn = false, autoOn = false, autoAt = 6, mouthAmt = 0, pointerOn = false, again = false;
const autoBtn = document.getElementById('auto'), talkBtn = document.getElementById('talk');
autoBtn.onclick = () => { autoOn = !autoOn; autoBtn.setAttribute('aria-pressed', autoOn); autoAt = 0; };
talkBtn.onclick = () => { talkOn = !talkOn; talkBtn.setAttribute('aria-pressed', talkOn); };
document.getElementById('blinkNow').onclick = () => { blinkT = 0; };
function setTalk(on){ talkOn = on; talkBtn.setAttribute('aria-pressed', on); }
document.getElementById('say').onclick = () => {
  let done = false; const stop = () => { if (!done) { done = true; setTalk(false); } };
  setTalk(true); setTimeout(stop, 9000);
  try {
    if (!('speechSynthesis' in window)) throw new Error('no speech');
    const m = new SpeechSynthesisUtterance("Hi. I'm here. What are we doing today?");
    m.onend = stop; m.onerror = stop; speechSynthesis.cancel(); speechSynthesis.speak(m);
  } catch (e) { setTimeout(stop, 2600); }
};
window.__force = o => Object.assign(window, o);

function aim(e){
  const x = (e.touches ? e.touches[0].clientX : e.clientX) / innerWidth;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) / innerHeight;
  gx = (x - .5) * 2; gy = (y - .5) * 2;
}
addEventListener('pointermove', e => { pointerOn = true; aim(e); }); addEventListener('pointerdown', e => { pointerOn = true; aim(e); });
addEventListener('pointerleave', () => { pointerOn = false; });
addEventListener('pointerup', () => { pointerOn = false; });

function resize(){
  const d = Math.min(devicePixelRatio || 1, 1.5);
  canvas.width = innerWidth * d; canvas.height = innerHeight * d;
  gl.viewport(0,0,canvas.width,canvas.height);
  const W = canvas.width, H = canvas.height;
  // picture is square: ~84% of the height, top-aligned, centred horizontally
  const size = H * .84;
  const sx = W / size, sy = H / size;
  gl.uniform2f(u.uvS, sx, sy); gl.uniform2f(u.uvO, (1 - sx) / 2, 0);
}
addEventListener('resize', resize); resize();

let last = performance.now(), T0 = last;
async function boot(){
  await load(0); strip.children[0].classList.add('on'); loadExtras();
  POSES.forEach((_,i) => i && setTimeout(() => load(i), 300*i));
  requestAnimationFrame(frame);
}
function frame(now){
  const dt = Math.min((now-last)/1000, .1); last = now; const t = (now-T0)/1000;
  const calm = talkOn ? 0 : 1;
  const tgx = pointerOn ? gx : calm*(.26*Math.sin(t*.37) + .08*Math.sin(t*.91)), tgy = pointerOn ? gy : calm*.12*Math.sin(t*.29 + 1);
  tx += (tgx - tx) * (1 - Math.exp(-dt*5)); ty += (tgy - ty) * (1 - Math.exp(-dt*5));
  // blink: lid closes fast, opens a little slower, sometimes twice
  nextBlink -= dt;
  if (blinkT < 0 && nextBlink <= 0) { blinkT = 0; again = Math.random() < .15; nextBlink = 2.2 + Math.random()*4; }
  let bl = 0;
  if (blinkT >= 0) {
    blinkT += dt; const B = blinkT;
    bl = B < .07 ? B/.07 : B < .10 ? 1 : 1 - (B-.10)/.14;
    bl = Math.max(0, Math.min(1, bl)); bl = bl*bl*(3-2*bl);
    if (B > .24) { blinkT = -1; if (again) { again = false; nextBlink = .12; } }
  }
  if (window.__blink != null) bl = window.__blink;
  // mouth: syllable-like opening while talking
  const syll = Math.abs(Math.sin(t*8.5 + 1.7*Math.sin(t*2.3))), pause = Math.min(1, Math.max(0, 1.6*Math.sin(t*1.1) + .9));
  const mt = talkOn ? Math.pow(syll, .8)*pause*.9 : 0;
  mouthAmt += (mt - mouthAmt) * (1 - Math.exp(-dt*18));
  talk += ((talkOn ? 1 : 0) - talk) * (1 - Math.exp(-dt*6));
  // fade
  if (fading) { mixv += dt/.55; if (mixv >= 1) { mixv = 1; cur = nxt; fading = false; } }
  if (autoOn && !fading) { autoAt -= dt; if (autoAt <= 0) { autoAt = 5 + Math.random()*4; setPose((cur + 1 + Math.floor(Math.random()*(POSES.length-1))) % POSES.length); } }
  const tA = tex[cur], tB = tex[fading ? nxt : cur];
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tA); gl.uniform1i(u.A, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tB); gl.uniform1i(u.B, 1);
  const ex = extra[cur];
  [[2,u.X,ex?ex[0]:tA],[3,u.Y,ex?ex[1]:tA],[4,u.Z,ex?ex[2]:tA]].forEach(([n,loc,T]) => { gl.activeTexture(gl.TEXTURE0+n); gl.bindTexture(gl.TEXTURE_2D, T); gl.uniform1i(loc, n); });
  gl.uniform1f(u.hx, ex ? 1 : 0);
  gl.uniform1f(u.mixv, fading ? mixv : 0);
  gl.uniform1f(u.t, window.__t != null ? window.__t : t); gl.uniform1f(u.blink, bl);
  featUniforms(cur,'A'); featUniforms(fading ? nxt : cur,'B'); gl.uniform1f(u.mouth, window.__mouth != null ? window.__mouth : mouthAmt);
  gl.uniform1f(u.tx, window.__tx != null ? window.__tx : tx); gl.uniform1f(u.ty, ty); gl.uniform1f(u.talk, talk);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
boot();
setTimeout(() => { const h = document.querySelector('.hint'); h.style.transition = 'opacity 1s'; h.style.opacity = 0; }, 5000);
</script>
</body>
</html>
