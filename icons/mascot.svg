<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Drift the jellyfish">
  <style>
    .dome{animation:pulse 3.4s ease-in-out infinite;transform-origin:100px 118px;transform-box:view-box}
    .t{animation:sway 2.8s ease-in-out infinite alternate;transform-origin:50% 0;transform-box:fill-box}
    .t1,.t3{animation-delay:-1.2s}.t2{animation-delay:-.6s}.t4{animation-delay:-1.9s}
    .b{animation:float 5s ease-in infinite}.b2{animation-delay:-2.4s}.b3{animation-delay:-3.7s}
    @keyframes pulse{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
    @keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
    @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-46px);opacity:0}}
  </style>
  <defs>
    <radialGradient id="gl"><stop offset="0" stop-color="#b4a3ff" stop-opacity=".55"/><stop offset="1" stop-color="#b4a3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d0ff"/><stop offset="1" stop-color="#8f7ae0"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4a3ff"/><stop offset="1" stop-color="#6e5bd6" stop-opacity=".25"/></linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#gl)"/>
  <circle class="b" cx="46" cy="164" r="4" fill="#d9d0ff" opacity=".7"/><circle class="b b2" cx="156" cy="170" r="3" fill="#d9d0ff" opacity=".7"/><circle class="b b3" cx="104" cy="182" r="2.6" fill="#d9d0ff" opacity=".7"/>
  <path class="t t0" d="M62 118 q-15 14 0 28 t10 28 t-10 22" fill="none" stroke="url(#tg)" stroke-width="8" stroke-linecap="round"/><path class="t t1" d="M80 118 q12 14 0 28 t-8 28 t8 22" fill="none" stroke="url(#tg)" stroke-width="8" stroke-linecap="round"/><path class="t t2" d="M100 118 q-9 14 0 28 t6 28 t-6 22" fill="none" stroke="url(#tg)" stroke-width="9" stroke-linecap="round"/><path class="t t3" d="M120 118 q15 14 0 28 t-10 28 t10 22" fill="none" stroke="url(#tg)" stroke-width="8" stroke-linecap="round"/><path class="t t4" d="M138 118 q-12 14 0 28 t8 28 t-8 22" fill="none" stroke="url(#tg)" stroke-width="8" stroke-linecap="round"/>
  <g class="dome">
    <path d="M38 118 C36 56 68 28 100 28 C132 28 164 56 162 118 Q132 134 100 124 Q68 134 38 118Z" fill="url(#dg)"/>
    <ellipse cx="74" cy="56" rx="20" ry="11" fill="#fff" opacity=".4" transform="rotate(-25 74 56)"/>
    <circle cx="80" cy="94" r="6.4" fill="#1a1230"/><circle cx="120" cy="94" r="6.4" fill="#1a1230"/>
    <circle cx="82.2" cy="91.6" r="2.2" fill="#fff"/><circle cx="122.2" cy="91.6" r="2.2" fill="#fff"/>
    <circle cx="64" cy="108" r="7" fill="#ff8fb1" opacity=".65"/><circle cx="136" cy="108" r="7" fill="#ff8fb1" opacity=".65"/>
    <path d="M91 104 Q100 114 109 104" fill="none" stroke="#1a1230" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M40 104 C38 14 162 14 160 104" fill="none" stroke="#f4f1ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="27" y="90" width="20" height="36" rx="10" fill="#f4f1ff"/><rect x="32" y="97" width="10" height="22" rx="5" fill="#6e5bd6"/>
    <rect x="153" y="90" width="20" height="36" rx="10" fill="#f4f1ff"/><rect x="158" y="97" width="10" height="22" rx="5" fill="#6e5bd6"/>
  </g></svg>
